services:
  tradingagents:
    build: .
    env_file:
      - .env
    environment:
      # A container's 127.0.0.1 is not the host, so reach the host-side
      # OpenAI-compatible relay through the Docker host gateway.
      - TRADINGAGENTS_LLM_BACKEND_URL=http://host.docker.internal:8317/v1
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
