}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

                  &lt;/div&gt;
                  &lt;div&gt;
                    &lt;label class=&quot;tap-lbl&quot; for=&quot;tap-dv-2&quot;&gt;技术指标 &lt;code class=&quot;tap-env&quot;&gt;technical_indicators&lt;/code&gt;&lt;/label&gt;
                    &lt;select class=&quot;tap-input&quot; id=&quot;tap-dv-2&quot;&gt;&lt;option selected&gt;yfinance&lt;/option&gt;&lt;option&gt;alpha_vantage&lt;/option&gt;&lt;option&gt;yfinance,alpha_vantage&lt;/option&gt;&lt;/select&gt;

                    &lt;label class=&quot;tap-lbl&quot; for=&quot;tap-dv-5&quot;&gt;宏观 &lt;code class=&quot;tap-env&quot;&gt;macro_data&lt;/code&gt;&lt;/label&gt;

                    &lt;input class=&quot;tap-range&quot; id=&quot;tap-set-risk&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;5&quot; step=&quot;1&quot; value=&quot;1&quot;&gt;
                    &lt;div class=&quot;tap-hint&quot;&gt;&lt;code&gt;TRADINGAGENTS_MAX_RISK_ROUNDS&lt;/code&gt;&lt;/div&gt;

&lt;style&gt;
#ta-desktop-proto{
  --tap-bg: light-dark(#f4f5f7, #15171c);
  --tap-panel: light-dark(#ffffff, #1d2027);
  --tap-panel2: light-dark(#fafbfc, #21252d);
  --tap-bd: light-dark(#e2e5ea, #303540);
  --tap-bd2: light-dark(#eceef2, #282d36);
  --tap-tx: light-dark(#181b21, #e7eaf0);
  --tap-mt: light-dark(#6a7280, #98a1b0);
  --tap-ac: light-dark(#2563eb, #6ba5fb);
  --tap-gr: light-dark(#15803d, #4ade80);
  --tap-am: light-dark(#b45309, #fbbf24);
  --tap-rd: light-dark(#b91c1c, #f87171);
  color: var(--tap-tx); font-size:13px; line-height:1.55;
}
#ta-desktop-proto *{ box-sizing:border-box; }
#ta-desktop-proto .tap-window{
  height:min(84vh, 860px); min-height:620px; display:flex; flex-direction:column;
  background:var(--tap-bg); border:1px solid var(--tap-bd); border-radius:12px; overflow:hidden;
  box-shadow:0 12px 40px light-dark(rgba(20,25,40,.14), rgba(0,0,0,.45));
}
#ta-desktop-proto .tap-titlebar{
  height:36px; flex:0 0 36px; display:flex; align-items:center; gap:8px; padding:0 13px;
  background:var(--tap-panel2); border-bottom:1px solid var(--tap-bd); position:relative;
}
#ta-desktop-proto .tap-dot{ width:11px; height:11px; border-radius:50%; display:block; }
#ta-desktop-proto .tap-dot-r{ background:#ff5f57; }
#ta-desktop-proto .tap-dot-y{ background:#febc2e; }
#ta-desktop-proto .tap-dot-g{ background:#28c840; }
#ta-desktop-proto .tap-title{
  position:absolute; left:0; right:0; text-align:center;
  font-size:12px; font-weight:600; color:var(--tap-mt); pointer-events:none;
}
#ta-desktop-proto .tap-body{ flex:1; display:flex; min-height:0; }

#ta-desktop-proto .tap-sidebar{
  width:212px; flex:0 0 212px; background:var(--tap-panel2); border-right:1px solid var(--tap-bd);
  padding:10px 9px; display:flex; flex-direction:column; gap:2px; overflow:auto;
}
#ta-desktop-proto .tap-newbtn{
  display:flex; align-items:center; gap:7px; width:100%; padding:7px 9px; margin-bottom:8px;
  background:var(--tap-ac); color:#fff; border:0; border-radius:7px;
  font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit;
}
#ta-desktop-proto .tap-side-label{
  font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  color:var(--tap-mt); padding:9px 6px 4px;
}
#ta-desktop-proto .tap-side-item{
  display:flex; align-items:center; gap:7px; width:100%; padding:6px 8px;
  background:transparent; border:0; border-radius:6px; cursor:pointer;
  color:var(--tap-tx); font-size:12.5px; text-align:left; font-family:inherit;
}
#ta-desktop-proto .tap-side-item:hover{ background:light-dark(#eef0f4, #272c35); }
#ta-desktop-proto .tap-side-item.tap-on{ background:light-dark(#e4ebfa, #2b3444); }
#ta-desktop-proto .tap-side-name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
#ta-desktop-proto .tap-muted{ color:var(--tap-mt); font-weight:400; }
#ta-desktop-proto .tap-side-pill{
  font-size:10px; font-weight:700; padding:1.5px 6px; border-radius:20px;
  background:light-dark(#fef3c7,#4a3a12); color:var(--tap-am); white-space:nowrap;
}
#ta-desktop-proto .tap-side-pill.tap-done{ background:light-dark(#dcfce7,#123d22); color:var(--tap-gr); }
#ta-desktop-proto .tap-side-tag{ font-size:10px; font-weight:700; padding:1.5px 5px; border-radius:4px; white-space:nowrap; }
#ta-desktop-proto .tap-tag-red{ background:light-dark(#fee2e2,#48191a); color:var(--tap-rd); }
#ta-desktop-proto .tap-tag-amber{ background:light-dark(#fef3c7,#4a3a12); color:var(--tap-am); }
#ta-desktop-proto .tap-tag-gray{ background:light-dark(#eceef2,#2b303a); color:var(--tap-mt); }
#ta-desktop-proto .tap-side-foot{
  margin-top:auto; padding:9px 7px 3px; border-top:1px solid var(--tap-bd);
  display:flex; align-items:center; gap:6px; font-size:11px; color:var(--tap-mt);
}

#ta-desktop-proto .tap-main{ flex:1; min-width:0; display:flex; flex-direction:column; }
#ta-desktop-proto .tap-view{ flex:1; min-height:0; display:flex; flex-direction:column; }
#ta-desktop-proto .tap-view[hidden]{ display:none; }

#ta-desktop-proto .tap-form-scroll{ padding:20px 26px; overflow:auto; }
#ta-desktop-proto .tap-h3{ margin:0 0 16px; font-size:16px; font-weight:650; }
#ta-desktop-proto .tap-grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px 18px; margin-bottom:15px; }
#ta-desktop-proto .tap-grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-bottom:15px; }
#ta-desktop-proto .tap-lbl{ display:block; font-size:11.5px; font-weight:650; margin-bottom:5px; }
#ta-desktop-proto .tap-input{
  width:100%; padding:6px 9px; font-size:12.5px; font-family:inherit; color:var(--tap-tx);
  background:var(--tap-panel); border:1px solid var(--tap-bd); border-radius:6px;

      {at:135, h:null, html:&#x27;&lt;h4&gt;一、执行摘要&lt;/h4&gt;&lt;p&gt;本周（2026 年 9 月 1 日至 9 月 8 日），英伟达及整体科技板块面临多重压力。虽然公司基本面强劲，但宏观环境趋紧、内部人士大规模抛售、以及地缘政治风险上升等因素正在对股价构成压力。&lt;/p&gt;&lt;h4&gt;二、重大警示信号：186 亿美元内部人士抛售&lt;/h4&gt;&lt;p&gt;最引人注目的新闻是，&lt;strong&gt;英伟达、Palantir 和 Meta 三家公司的内部人士正在发出 186 亿美元的警示信号&lt;/strong&gt;。这表明最了解公司的高管和内部人员可能对当前估值持谨慎态度。&lt;/p&gt;&lt;ul&gt;&lt;li&gt;内部人士抛售规模达到 186 亿美元，创历史新高&lt;/li&gt;&lt;li&gt;这种集中抛售往往预示着股价调整风险&lt;/li&gt;&lt;/ul&gt;&lt;h4&gt;三、AI 芯片租赁价格上涨 22%&lt;/h4&gt;&lt;p&gt;英伟达 CEO 黄仁勋指出，&lt;strong&gt;AI 芯片租赁价格上涨 22%&lt;/strong&gt;，证明即使是老一代芯片仍保持强劲盈利能力。&lt;/p&gt;&lt;h4&gt;四、宏观：美联储鹰派立场明确&lt;/h4&gt;&lt;p&gt;预测市场数据显示 &lt;strong&gt;93% 概率不降息&lt;/strong&gt;；2026 年通胀超过 5% 的概率为 8%（一周内上升 1.5 个百分点）。&lt;/p&gt;&#x27;}
    ],
    fundamentals_report: [
      {at:178, h:null, html:&#x27;&lt;h4&gt;盈利能力：依然强劲&lt;/h4&gt;&lt;p&gt;英伟达维持 &lt;strong&gt;90% 毛利率&lt;/strong&gt; 与 &lt;strong&gt;50% 净利率&lt;/strong&gt;，数据中心业务营收同比增长超 &lt;strong&gt;400%&lt;/strong&gt;。CUDA 生态构成短期难以撼动的护城河。&lt;/p&gt;&lt;h4&gt;估值：昂贵但不荒谬&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Forward P/E &lt;strong&gt;40 倍&lt;/strong&gt;，处于历史 &lt;strong&gt;85 分位&lt;/strong&gt;&lt;/li&gt;&lt;li&gt;EV/Sales &lt;strong&gt;25 倍&lt;/strong&gt;，历史上该水平后 12 个月平均回报为负&lt;/li&gt;&lt;li&gt;自由现金流收益率 &lt;strong&gt;2.5%&lt;/strong&gt;，低于 10 年期国债&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;风险收益呈不对称：向上空间 30–40% 对应向下风险 20–30%。&lt;/p&gt;&lt;p&gt;数据源：&lt;strong&gt;yfinance&lt;/strong&gt; · 宏观序列 &lt;strong&gt;FRED&lt;/strong&gt;&lt;/p&gt;&#x27;}
    ],
    investment_plan: [
      {at:196, h:&#x27;Bull Researcher Analysis&#x27;, html:&#x27;&lt;p&gt;&lt;strong&gt;各位投资者，今天我要为大家阐述为什么英伟达仍然是本世纪最具投资价值的科技股之一。&lt;/strong&gt;&lt;/p&gt;&lt;h4&gt;一、核心论点：基本面强劲压倒短期噪音&lt;/h4&gt;&lt;p&gt;让我开门见山：市场上充斥着各种恐慌情绪——内部人士抛售、九月效应、美联储鹰派——但这些都是&lt;strong&gt;短期噪音&lt;/strong&gt;，完全无法改变英伟达作为 AI 革命核心受益者的长期逻辑。&lt;/p&gt;&lt;h4&gt;二、&quot;内部人士抛售&quot;是伪命题&lt;/h4&gt;&lt;p&gt;当你的股票从 100 美元涨到 1000 美元，出售 10–15% 的持股进行多元化配置是完全正常的财务规划，而非信心不足。&lt;/p&gt;&#x27;},
      {at:214, h:&#x27;Bear Researcher Analysis&#x27;, html:&#x27;&lt;p&gt;&lt;strong&gt;各位投资者，让我用冷静的数据和逻辑，揭穿多头分析师编织的美梦。&lt;/strong&gt;&lt;/p&gt;&lt;h4&gt;一、核心反驳：多头在选择性忽视致命风险&lt;/h4&gt;&lt;p&gt;我的多头对手试图将所有警示信号都归类为&quot;短期噪音&quot;，但让我问一个简单的问题：&lt;strong&gt;如果 186 亿美元的内部人士抛售、93% 的不降息概率、历史最高估值、地缘政治风险都是&quot;噪音&quot;，那什么才算是&quot;信号&quot;？&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;这种选择性解读恰恰暴露了多头逻辑的致命缺陷——&lt;strong&gt;只看想看的，忽视不想看的&lt;/strong&gt;。&lt;/p&gt;&#x27;},
      {at:228, h:&#x27;Research Manager Decision&#x27;, html:&#x27;&lt;p&gt;双方论点均有依据，但空头对&lt;strong&gt;风险收益不对称性&lt;/strong&gt;的论证更具说服力。内部人士抛售规模达历史均值 6 倍，叠加 93% 不降息概率与 85 分位估值，构成明确的短期压制组合。&lt;/p&gt;&lt;p&gt;建议方向：&lt;strong&gt;Underweight&lt;/strong&gt;。保留核心仓位参与 AI 长期逻辑，但降低风险暴露等待更优入场点。&lt;/p&gt;&#x27;}
    ],
    trader_investment_plan: [
      {at:242, h:null, html:&#x27;&lt;h4&gt;Action：Sell&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Reasoning&lt;/strong&gt;：根据研究团队的深度分析，建议对 NVDA 采取减持行动。关键风险因素包括：&lt;/p&gt;&lt;ul&gt;&lt;li&gt;内部人士抛售规模达 186 亿美元，为历史平均水平 &lt;strong&gt;6 倍&lt;/strong&gt;，显示高管信心不足&lt;/li&gt;&lt;li&gt;&lt;strong&gt;93% 不降息概率&lt;/strong&gt;对高估值股票构成压制，当前估值已充分反映乐观预期&lt;/li&gt;&lt;li&gt;散户极端乐观情绪（72% 看涨）与机构减持形成反向指标&lt;/li&gt;&lt;li&gt;AMD 和云厂商自研芯片的竞争威胁被市场低估&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;Position Sizing&lt;/strong&gt;：将 NVDA 仓位减持至目标配置的 50–60%，分 2–3 周执行；对剩余仓位设置 8–10% 跟踪止损。&lt;/p&gt;&lt;p&gt;FINAL TRANSACTION PROPOSAL: &lt;strong&gt;SELL&lt;/strong&gt;&lt;/p&gt;&#x27;}
    ],
    final_trade_decision: [
      {at:254, h:&#x27;Aggressive Analyst Analysis&#x27;, html:&#x27;&lt;p&gt;各位同事，我必须开门见山地指出：这个所谓的&quot;减持建议&quot;完全是被恐慌情绪绑架的决策，是典型的在黎明前最黑暗时刻选择放弃的错误示范！&lt;/p&gt;&lt;p&gt;关于那个被反复强调的 186 亿美元内部人士抛售——这 186 亿是 NVDA、Palantir 和 Meta &lt;strong&gt;三家公司的总和&lt;/strong&gt;，并非单独针对英伟达。英伟达高管持股价值在过去两年暴涨了 5–8 倍。&lt;/p&gt;&#x27;},
      {at:266, h:&#x27;Conservative Analyst Analysis&#x27;, html:&#x27;&lt;p&gt;听完激进分析师这番慷慨激昂的演讲，我必须指出一个核心问题：&lt;strong&gt;将乐观情绪包装成数据分析，并不能改变风险的客观存在&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;根据 SEC 披露记录，英伟达内部人士在过去 12 个月的抛售规模是过去 5 年平均水平的 &lt;strong&gt;6 倍&lt;/strong&gt;。这不是正常减持，而是系统性的大规模撤离。你提到 Bezos 的例子？2022 年亚马逊暴跌 &lt;strong&gt;50%&lt;/strong&gt;。&lt;/p&gt;&#x27;},
      {at:274, h:&#x27;Neutral Analyst Analysis&#x27;, html:&#x27;&lt;p&gt;双方各有偏颇。我提供一个情景加权视角：&lt;/p&gt;&lt;ul&gt;&lt;li&gt;乐观情景 &lt;strong&gt;40%&lt;/strong&gt;：上涨 35%&lt;/li&gt;&lt;li&gt;中性情景 &lt;strong&gt;35%&lt;/strong&gt;：上涨 5%&lt;/li&gt;&lt;li&gt;悲观情景 &lt;strong&gt;25%&lt;/strong&gt;：下跌 20%&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;期望收益约 &lt;strong&gt;8–10%&lt;/strong&gt;。完全减持至 50% 会过度牺牲上行参与度，但满仓持有同样不合理。&lt;/p&gt;&#x27;},
      {at:288, h:&#x27;Portfolio Manager Decision&#x27;, html:&#x27;&lt;div class=&quot;tap-rate&quot;&gt;&lt;span class=&quot;tap-rate-k&quot;&gt;最终评级&lt;/span&gt;&lt;span class=&quot;tap-scale&quot;&gt;&lt;span&gt;Buy&lt;/span&gt;&lt;span&gt;Overweight&lt;/span&gt;&lt;span&gt;Hold&lt;/span&gt;&lt;span class=&quot;tap-pick&quot;&gt;Underweight&lt;/span&gt;&lt;span&gt;Sell&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Executive Summary&lt;/strong&gt;：将 NVDA 仓位从当前水平减持至目标配置的 &lt;strong&gt;60–70%&lt;/strong&gt;，分 2–3 周执行以降低市场冲击。对剩余仓位设置 &lt;strong&gt;12% 跟踪止损&lt;/strong&gt;保护账面利润。保留 30–40% 现金作为&quot;自我保险&quot;。&lt;/p&gt;&lt;h4&gt;为何选择 Underweight 而非 Hold 或 Sell&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;不是 Sell&lt;/strong&gt;：英伟达长期逻辑成立，AI 革命确实刚开始，完全离场可能错过结构性机会&lt;/li&gt;&lt;li&gt;&lt;strong&gt;不是 Hold&lt;/strong&gt;：当前估值已 price in 过多乐观预期，短期负面因素正在累积&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Underweight&lt;/strong&gt; 正确反映了&quot;减少暴露但保持参与&quot;的策略定位&lt;/li&gt;&lt;/ul&gt;&#x27;}
    ]
  };

  var T = 0, playing = false, follow = true, activeTab = &#x27;market_report&#x27;, timer = null, logFilter = &#x27;all&#x27;;

  function agState(a){ return T &gt;= a.e ? &#x27;done&#x27; : (T &gt;= a.s ? &#x27;running&#x27; : &#x27;pending&#x27;); }
  function secBlocks(key){ return (BLOCKS[key] || []).filter(function(b){ return T &gt;= b.at; }); }
  function secDone(key){
    var s = null;
    for(var i=0;i&lt;SECTIONS.length;i++){ if(SECTIONS[i].key===key) s=SECTIONS[i]; }
    if(!s) return false;
    for(var j=0;j&lt;AGENTS.length;j++){ if(AGENTS[j].name===s.by) return T &gt;= AGENTS[j].e; }
    return false;
  }
  function fmt(s){

    return (m&lt;10?&#x27;0&#x27;:&#x27;&#x27;)+m+&#x27;:&#x27;+(r&lt;10?&#x27;0&#x27;:&#x27;&#x27;)+r;
  }

  function renderPipe(){
    var html = &#x27;&#x27;, last = null;
    AGENTS.forEach(function(a){
      if(a.team !== last){
        if(last !== null) html += &#x27;&lt;/div&gt;&#x27;;
        html += &#x27;&lt;div class=&quot;tap-team&quot;&gt;&lt;div class=&quot;tap-team-h&quot;&gt;&lt;i data-lucide=&quot;&#x27;+a.ti+&#x27;&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27;+a.team+&#x27;&lt;/div&gt;&#x27;;
        last = a.team;
      }
      var st = agState(a);
      var ic = st===&#x27;done&#x27; ? &#x27;check&#x27; : (st===&#x27;running&#x27; ? &#x27;loader&#x27; : &#x27;circle&#x27;);
      var sub = st===&#x27;done&#x27; ? (a.e-a.s)+&#x27;s&#x27; : (st===&#x27;running&#x27; ? Math.max(0,Math.round(T-a.s))+&#x27;s&#x27; : &#x27;&#x27;);
      html += &#x27;&lt;div class=&quot;tap-ag tap-ag-&#x27;+st+&#x27;&quot;&gt;&#x27;
           +  &#x27;&lt;span class=&quot;tap-ag-ic&quot;&gt;&lt;i data-lucide=&quot;&#x27;+ic+&#x27;&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&#x27;
           +  &#x27;&lt;span class=&quot;tap-ag-t&quot;&gt;&#x27;+a.name+&#x27;&lt;/span&gt;&#x27;
           +  &#x27;&lt;span class=&quot;tap-ag-s&quot;&gt;&#x27;+sub+&#x27;&lt;/span&gt;&lt;/div&gt;&#x27;;
    });
    html += &#x27;&lt;/div&gt;&#x27;;
    elPipe.innerHTML = html;
  }

  function renderTabs(){

  function renderLog(){
    var vis = LOG.filter(function(l){ return T &gt;= l.t; });
    var rows = vis.filter(function(l){ return logFilter===&#x27;all&#x27; || l.k===logFilter; });
    elLog.innerHTML = rows.map(function(l){
      var kl = l.k===&#x27;tool&#x27; ? &#x27;TOOL&#x27; : (l.k===&#x27;msg&#x27; ? &#x27;MSG&#x27; : &#x27;SYS&#x27;);
      return &#x27;&lt;div class=&quot;tap-lg&quot;&gt;&lt;div class=&quot;tap-lg-top&quot;&gt;&#x27;
        + &#x27;&lt;span class=&quot;tap-lg-t&quot;&gt;&#x27;+fmt(l.t)+&#x27;&lt;/span&gt;&#x27;
        + &#x27;&lt;span class=&quot;tap-lg-k tap-k-&#x27;+l.k+&#x27;&quot;&gt;&#x27;+kl+&#x27;&lt;/span&gt;&lt;/div&gt;&#x27;
        + &#x27;&lt;div class=&quot;tap-lg-b&quot;&gt;&#x27;+l.b+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
    }).join(&#x27;&#x27;);
    elLog.scrollTop = elLog.scrollHeight;
    root.querySelector(&#x27;#tap-log-count&#x27;).textContent =
      (logFilter===&#x27;all&#x27; ? vis.length + &#x27; 条&#x27; : rows.length + &#x27; / &#x27; + vis.length);
  }

  function renderHead(){
    var tools = LOG.filter(function(l){ return T&gt;=l.t &amp;&amp; l.k===&#x27;tool&#x27;; }).length;
    var reps = SECTIONS.filter(function(s){ return secDone(s.key); }).length;
    var cur = &#x27;—&#x27;;
    for(var i=0;i&lt;AGENTS.length;i++){ if(agState(AGENTS[i])===&#x27;running&#x27;){ cur = AGENTS[i].name; break; } }
    var finished = T &gt;= TOTAL - 2;
    if(finished) cur = &#x27;已完成&#x27;;
    root.querySelector(&#x27;#tap-st-time&#x27;).textContent = fmt(T);
    root.querySelector(&#x27;#tap-st-tools&#x27;).textContent = tools;
    root.querySelector(&#x27;#tap-st-rep&#x27;).textContent = reps + &#x27;/7&#x27;;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;

    target?.nodeType != null &amp;&amp; trigger.contains(target);
